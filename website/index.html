<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="Project Lens turns unfamiliar codebases into clear, evidence-backed guides.">
  <meta name="theme-color" content="#0e1014">
  <meta name="project-lens-build" content="approved-prototype">
  <title>Project Lens — Understand the system beneath the files</title>
  <style>
    :root{--bg:#0e1014;--text:#eae5dc;--text2:#b7bdc6;--mute:#707986;--accent:#d99a68;--accent-soft:#e9bd8e;--line:rgba(255,255,255,.09);--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:var(--bg)}body{color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    #terrain{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}.grain,.vignette{position:fixed;inset:0;pointer-events:none}.grain{z-index:3;opacity:.45;mix-blend-mode:overlay;background-image:radial-gradient(#fff 0 1px,transparent 1px);background-size:3px 3px}.vignette{z-index:2;background:radial-gradient(120% 95% at 50% 38%,transparent 58%,rgba(0,0,0,.5))}
    .head{position:fixed;top:26px;left:30px;z-index:30;pointer-events:none}.mark{font-family:var(--serif);font-size:18px}.mark em{font-style:italic;color:var(--accent)}.tag,.key,.label,.chip,.build{font-family:var(--mono)}.tag{margin-top:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}.hint{position:fixed;top:28px;right:30px;z-index:30;display:flex}.key{display:inline-flex;gap:5px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:10px;color:var(--mute)}.key b{color:var(--text)}
    .dots{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:14px}.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .55s}.dot.on{background:var(--accent);width:20px;border-radius:3px}.ctl{position:fixed;bottom:26px;right:26px;z-index:30;display:flex;gap:8px}.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);font-size:19px;cursor:pointer}.ctl button:hover,.ctl button:focus-visible{background:rgba(255,255,255,.09);border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .menu{position:fixed;bottom:80px;right:22px;z-index:40;width:250px;padding:8px;border-radius:14px;background:rgba(17,20,26,.97);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.55);opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transition:opacity .25s,transform .25s}.menu.open{opacity:1;pointer-events:auto;transform:none}.menu h4{margin:4px 12px 8px;font:9px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}.menu a{display:flex;justify-content:space-between;padding:10px 11px;border-radius:9px;text-decoration:none;color:var(--text);font-size:13px}.menu a:hover,.menu a:focus-visible,.menu a.on{background:rgba(255,255,255,.06);color:var(--accent)}
    .content{position:fixed;inset:0;z-index:10;pointer-events:none}.section{position:absolute;inset:0;display:flex;align-items:center;padding:0 clamp(40px,12vw,200px);opacity:0}.section-inner{max-width:720px}.section h1,.section h2{font:600 clamp(38px,6vw,64px)/1 var(--serif);letter-spacing:-.01em;margin-bottom:20px}.section h2 em{font-style:italic;color:var(--accent)}.label{font-size:11px;letter-spacing:.22em;color:var(--accent);margin-bottom:20px}.lead{font:italic clamp(17px,1.8vw,21px)/1.45 var(--serif);margin-bottom:16px}.p{font-size:clamp(14px,1.4vw,16px);line-height:1.72;color:var(--mute);max-width:58ch}.p b{color:var(--text2)}.list{display:flex;flex-direction:column;margin-top:6px}.row{display:flex;gap:24px;padding:14px 0;border-bottom:1px solid var(--line)}.idx{font:10px var(--mono);color:var(--accent);flex:0 0 44px}.tx{font-size:16px}.sub{display:block;font-size:12.5px;color:var(--mute);margin-top:3px}.chiprow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.chip{padding:9px 15px;border-radius:20px;border:1px solid var(--line);font-size:13px;color:var(--text2)}.mini{display:flex;gap:18px;margin-top:26px;align-items:center;flex-wrap:wrap}.mini a{color:var(--accent);font:14px var(--mono);text-decoration:none;border-bottom:1px solid var(--accent-soft);padding-bottom:3px}.build{margin-top:25px;font-size:10px;color:var(--mute);letter-spacing:.08em}
    .cover{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(40px,11vw,180px);pointer-events:none;transition:opacity 1.1s}.cover.hide{opacity:0}.rule{width:72px;height:1px;background:var(--accent);margin-bottom:30px}.cover h1{font:600 clamp(44px,7.4vw,86px)/.98 var(--serif);letter-spacing:-.02em}.cover h1 em{font-style:italic;color:var(--accent)}.cover .by{margin-top:24px;font:12px/1.9 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}.cover .by b{color:var(--text2);font-weight:500}.cover .instr{margin-top:26px;font:12px var(--mono);color:#e0cfb8}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @media(max-width:720px){.hint,.dots{display:none}.ctl{right:14px;bottom:14px}.menu{left:14px;right:14px;width:auto;bottom:70px}.section{padding:0 24px}.section h1,.section h2{font-size:clamp(38px,12vw,52px)}.cover{padding:0 24px}.head{left:20px}.tag{font-size:9px}.p{font-size:15px}}
    @media(prefers-reduced-motion:reduce){.section{transition:none!important}.menu{transition:none}}
    .demo-frame{pointer-events:auto;width:min(100%,560px);aspect-ratio:16/9;margin-top:22px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(217,154,104,.12),rgba(255,255,255,.02));position:relative;overflow:hidden}.demo-frame video{display:block;width:100%;height:100%;object-fit:cover;background:#0b0d11}.demo-placeholder{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,4vw,42px);background:radial-gradient(circle at 75% 25%,rgba(217,154,104,.16),transparent 42%),linear-gradient(145deg,rgba(30,34,43,.96),rgba(12,14,18,.98))}.demo-placeholder .eyebrow{font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}.demo-placeholder h3{font:italic 26px/1.05 var(--serif);color:var(--text);margin-bottom:10px}.demo-placeholder p{max-width:42ch;font:12px/1.55 var(--mono);color:var(--mute)}.demo-placeholder .duration{margin-top:18px;color:var(--text2);font:10px var(--mono);letter-spacing:.08em}.demo-placeholder .play{position:absolute;right:clamp(20px,4vw,42px);bottom:clamp(20px,4vw,42px);width:42px;height:42px;border:1px solid var(--accent-soft);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:16px;opacity:.75}
  </style>
</head>
<body>
  <h1 class="sr-only">Project Lens — understand unfamiliar codebases.</h1>
  <canvas id="terrain" aria-label="A ball rolling across a quiet landscape. Drag, scroll, or use arrow keys to move between Project Lens sections."></canvas>
  <div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
  <header class="head"><div class="mark">PROJECT <em>Lens</em></div><div class="tag">A landscape for understanding code</div></header>
  <div class="hint" aria-hidden="true"><span class="key"><b>drag</b>&nbsp;terrain</span><span class="key"><b>scroll</b></span><span class="key"><b>← →</b></span></div>
  <nav class="dots" id="dots" aria-hidden="true"></nav><main class="content" id="content"></main>
  <div class="cover" id="cover"><div class="rule"></div><h1>See the system<br/><em>beneath the files.</em></h1><div class="by">Project Lens turns unfamiliar repositories into<br/><b>clear, evidence-backed guides.</b></div><div class="instr">Drag, scroll, or use arrow keys.</div></div>
  <nav class="menu" id="menu" aria-label="Jump to section"></nav><div class="ctl"><button id="prev" aria-label="Previous section">‹</button><button id="next" aria-label="Next section">›</button><button id="menuButton" aria-label="Jump to section" aria-haspopup="true" aria-expanded="false">⋮</button></div>
  <script>
  (()=>{
    const sections=[
      {title:'Introduction',lead:'Opening a repository is easy. Understanding it is not.',body:'Project Lens helps developers see where execution begins, how responsibilities connect, and what to learn first. It turns unfamiliar software into a calm, evidence-backed reading path.'},
      {title:'The problem',lead:'A folder tree is not a mental model.',body:'AI-generated projects can run before they make sense. Project Lens separates confirmed file evidence from inference, so you can learn what the project does without copying complexity blindly.'},
      {title:'How it works',lead:'From files to understanding.',body:'A deterministic inventory and import graph establish the evidence. Codex then explains the selected project inside a disposable, read-only snapshot and writes a persistent Overview and Complete Guide.',kind:'list',list:[['01','Select a project','Prepared sample or local folder'],['02','Map the evidence','Files, imports and project areas'],['03','Read the guide','Overview, code walkthroughs and cautions']]},
      {title:'What you get',lead:'A guide you can return to.',body:'The report keeps the useful parts of an agent run visible after the terminal is gone.',kind:'chips',chips:['Overview','Complete Guide','Project map','Code walkthroughs','Learning order','Review before copying']},
      {title:'Evidence first',lead:'Every explanation has somewhere to point.',body:'Project Lens shows important files, direct static imports, detected symbols and explicit limits. It does not pretend that a heuristic is a runtime call graph.',kind:'list',list:[['01','Confirmed','Static imports, file paths and generated artifacts'],['02','Inferred','Patterns that need developer review'],['03','Bounded','Unsupported formats and dynamic behavior']]},
      {title:'Built with Codex',lead:'Human direction. Agentic execution.',body:'Codex supported planning, implementation, testing and self-review. The public site is a static explanation of the product; it does not upload or analyse visitor projects.',kind:'contact'},
      {title:'Local-first limits',lead:'Useful, careful, unfinished by design.',body:'Projects are prepared locally and relevant text may be sent to your selected model provider. Sensitive and ignored files are excluded. Generated explanations still deserve developer review.'},
      {title:'See Project Lens in action',lead:'From repository to understanding.',body:'A short walkthrough of local project analysis, progress, evidence-backed reports and the Complete Guide.',kind:'contact',demo:true}
    ];
    const canvas=document.getElementById('terrain'),ctx=canvas.getContext('2d'),content=document.getElementById('content'),menu=document.getElementById('menu'),dots=document.getElementById('dots'),cover=document.getElementById('cover');
    if(!ctx)return;
    const N=sections.length;const INPUT={mouseImpulse:.74,trackpadImpulse:.42,keyboardImpulse:.5,dragImpulse:.0045,maxImpulse:.9,maxVelocity:1.1,wheelWindowMs:140};let W=0,HH=0,dpr=1,bx=0,bv=0,rot=0,last=performance.now(),dragging=false,lastX=0,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),gauss=(x,a,s)=>Math.exp(-.5*((x-a)/s)**2);
    const height=x=>{let y=.1*Math.sin(x*2.1);for(let i=0;i<N;i++)y-=(.2+.06*Math.sin(i*2))*gauss(x,i,.36);for(let i=0;i<N-1;i++)y+=(.13+.04*Math.cos(i*1.9))*gauss(x,i+.5,.24);return y};
    const slope=x=>(height(x+.03)-height(x-.03))/.06;
    const resize=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;HH=innerHeight;canvas.width=W*dpr;canvas.height=HH*dpr;canvas.style.width=W+'px';canvas.style.height=HH+'px';ctx.setTransform(dpr,0,0,dpr,0,0)};addEventListener('resize',resize);resize();
    sections.forEach((s,i)=>{const el=document.createElement('section');el.className='section';el.setAttribute('aria-labelledby','section-'+i);let extra='';if(s.kind==='list')extra='<div class="list">'+s.list.map(r=>`<div class="row"><span class="idx">${r[0]}</span><div><div class="tx">${r[1]}</div><span class="sub">${r[2]}</span></div></div>`).join('')+'</div>';if(s.kind==='chips')extra='<div class="chiprow">'+s.chips.map(c=>`<span class="chip">${c}</span>`).join('')+'</div>';if(s.kind==='contact')extra='<div class="mini"><a href="https://github.com/catDkiller/project-lens" target="_blank" rel="noreferrer">View Project Lens on GitHub ↗</a></div>';el.innerHTML=`<div class="section-inner"><div class="label">${['I','II','III','IV','V','VI','VII','VIII'][i]} · ${i+1}/${N}</div><h2 id="section-${i}">${s.title}</h2><p class="lead">${s.lead}</p><p class="p">${s.body}</p>${extra}${i===N-1?'<div class="build">PUBLIC DEMO · STATIC PRESENTATION · NO UPLOADS</div>':''}</div>`;content.appendChild(el)});
    const demoConfig=window.__PROJECT_LENS_DEMO__||{};const demoFrame=document.createElement('div');demoFrame.className='demo-frame';if(demoConfig.source){const video=document.createElement('video');video.controls=true;video.preload='metadata';video.playsInline=true;video.setAttribute('aria-label','Project Lens demo video');video.src=demoConfig.source;if(demoConfig.poster)video.poster=demoConfig.poster;demoFrame.appendChild(video)}else{demoFrame.innerHTML='<div class="demo-placeholder"><div class="eyebrow">Project Lens demo</div><h3>Video will be added before submission.</h3><p>A three-minute walkthrough of local project analysis, progress, evidence-backed reports and the Complete Guide.</p><div class="duration">EXPECTED DURATION · UNDER 3 MINUTES</div><span class="play" aria-hidden="true">›</span></div>'}content.lastElementChild.querySelector('.section-inner').appendChild(demoFrame);
    sections.forEach((s,i)=>{const d=document.createElement('span');d.className='dot'+(i===0?' on':'');dots.appendChild(d);const a=document.createElement('a');a.href='#';a.dataset.go=i;a.innerHTML=`${s.title}<span>${['I','II','III','IV','V','VI','VII','VIII'][i]}</span>`;a.onclick=e=>{e.preventDefault();go(i);menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')};menu.appendChild(a)});menu.insertAdjacentHTML('afterbegin','<h4>Jump to a section</h4>');
    const els=[...content.children],dotEls=[...dots.children],links=[...menu.querySelectorAll('a')];const closest=()=>Math.round(bx);const hideCover=()=>cover.classList.add('hide');const go=i=>{bx=clamp(i,0,N-1);bv=0;rot=0;hideCover()};const bump=v=>{hideCover();if(reduced)go(clamp(closest()+(v>0?1:-1),0,N-1));else bv=clamp(bv+clamp(v,-INPUT.maxImpulse,INPUT.maxImpulse),-INPUT.maxVelocity,INPUT.maxVelocity)};
    prev.onclick=()=>go((closest()-1+N)%N);next.onclick=()=>go((closest()+1)%N);menuButton.onclick=e=>{e.stopPropagation();const open=menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',open)};document.onclick=e=>{if(e.target!==menuButton&&!menu.contains(e.target)){menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}};
    canvas.onpointerdown=e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture?.(e.pointerId)};canvas.onpointermove=e=>{if(dragging){bump((e.clientX-lastX)*INPUT.dragImpulse);lastX=e.clientX}};canvas.onpointerup=()=>{dragging=false};canvas.onpointercancel=()=>{dragging=false};let wheelCarry=0,wheelDirection=0,lastWheelAt=0;const normalizeWheelDelta=e=>{let value=e.deltaY||e.deltaX||0;if(e.deltaMode===1)value*=16;if(e.deltaMode===2)value*=Math.max(HH,600);return clamp(value,-240,240)};addEventListener('wheel',e=>{if(e.target.closest?.('a,button,video,input,.menu'))return;const raw=normalizeWheelDelta(e);if(!raw)return;e.preventDefault();const now=performance.now(),direction=Math.sign(raw),trackpad=Math.abs(raw)<40;if(now-lastWheelAt>INPUT.wheelWindowMs||direction!==wheelDirection)wheelCarry=0;wheelDirection=direction;lastWheelAt=now;wheelCarry=clamp(wheelCarry+Math.abs(raw)/120,0,1.5);const impulse=(trackpad?INPUT.trackpadImpulse:INPUT.mouseImpulse)*clamp(wheelCarry,.35,1);wheelCarry=wheelCarry>.95?0:wheelCarry;bump(direction*impulse)},{passive:false});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){bump(-INPUT.keyboardImpulse);e.preventDefault()}if(e.key==='ArrowRight'){bump(INPUT.keyboardImpulse);e.preventDefault()}});
    const step=dt=>{let a=-slope(bx)*12-bv*2.6;bv=clamp(bv+a*dt,-1.1,1.1);bx+=bv*dt;if(bx<0){bx=0;bv=Math.abs(bv)*.3}if(bx>N-1){bx=N-1;bv=-Math.abs(bv)*.3}rot+=bv*dt};
    const draw=()=>{const g=ctx.createLinearGradient(0,0,0,HH);g.addColorStop(0,'#1a1e26');g.addColorStop(.5,'#14171d');g.addColorStop(1,'#0e0f13');ctx.fillStyle=g;ctx.fillRect(0,0,W,HH);const p=Math.max(170,W/2.6),base=W*.3-bx*p,ty=w=>HH*.97-height(w)*HH*.16;ctx.fillStyle='rgba(40,46,60,.9)';ctx.beginPath();ctx.moveTo(-10,HH);for(let x=-10;x<W+10;x+=Math.max(2,W/70))ctx.lineTo(x,ty((x-base)/p));ctx.lineTo(W+10,HH);ctx.fill();ctx.strokeStyle='rgba(233,189,142,.25)';ctx.beginPath();for(let x=-10;x<W+10;x+=Math.max(2,W/70))ctx.lineTo(x,ty((x-base)/p));ctx.stroke();const r=clamp(Math.min(W,HH)*.026,13,28),x=base+bx*p,y=ty(bx)-r;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,ty(bx)+r*.2,r*.85,r*.2,0,0,7);ctx.fill();const rg=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.25);rg.addColorStop(0,'#faf5e9');rg.addColorStop(.4,'#eee2cb');rg.addColorStop(.72,'#cbb68f');rg.addColorStop(1,'#5d636e');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
    const frame=now=>{const dt=Math.min((now-last)/1000,.05);last=now;if(!reduced)step(dt);const c=closest(),entered=cover.classList.contains('hide');els.forEach((el,i)=>{const d=Math.abs(bx-i);const opacity=entered?(reduced?(i===c?1:0):clamp(1-d/.5,0,1)):0;el.style.opacity=opacity;el.style.transform=`translateY(${(1-opacity)*12}px)`;dotEls[i].classList.toggle('on',i===c);links[i].classList.toggle('on',i===c)});draw();requestAnimationFrame(frame)};requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
